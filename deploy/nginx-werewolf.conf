# 狼人杀在线游戏 - Nginx 生产配置
# 部署目录: /root/werewolf-game (如需修改,同步改 root 和 proxy_pass)
# 使用方法:
#   sudo cp deploy/nginx-werewolf.conf /etc/nginx/sites-available/werewolf
#   sudo ln -sf /etc/nginx/sites-available/werewolf /etc/nginx/sites-enabled/werewolf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name langrensha.jxjhlrs.fun;

    # 前端构建产物
    root /root/werewolf-game/frontend/dist;
    index index.html;

    # 前端路由回退(SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端API反代
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # socket.io WebSocket反代(关键:Upgrade头)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
